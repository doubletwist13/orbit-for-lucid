name: Bug report
description: Something in Orbit does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste a VIN, an email address, a token or a raw API response.
  - type: input
    id: setup
    attributes:
      label: Car, watch and phone
      description: Car model and trim, watch model, phone model and Android version.
    validations:
      required: true
  - type: input
    id: orbit
    attributes:
      label: Orbit version
      description: Shown on the watch info screen and in the phone's app list.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the steps, and any message the watch or phone showed.
    validations:
      required: true
